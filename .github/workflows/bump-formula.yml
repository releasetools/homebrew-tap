name: Bump formula
run-name: Bump formula to ${{ inputs.version || github.event.client_payload.version || 'the latest release' }}

# Renovate handles the GitHub Actions in this repo, but it cannot bump the formula itself --
# see the comment at the top of scripts/bump-formula.sh, and the packageRules entry in
# renovate.json that disables its homebrew manager for that reason.
on:
  schedule:
    # Daily, so a missed dispatch still gets picked up.
    - cron: "17 9 * * *"

  # Manual runs, optionally targeting a specific release rather than the newest one.
  workflow_dispatch:
    inputs:
      version:
        description: "Release to bump to (e.g. v0.0.13). Defaults to the newest release."
        required: false
        default: ""

  # Lets releasetools/cli trigger this immediately after publishing a release. The payload
  # may carry a 'version'; without it the newest release is used.
  repository_dispatch:
    types: [upstream-released]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump the formula to the latest release
    runs-on: ubuntu-26.04
    steps:
      # GITHUB_TOKEN cannot open a pull request here: the organization does not
      # allow Actions to create them, and a repository cannot override that. One
      # it could open would have its checks held pending approval, which for a
      # formula bump means brew test-bot does not run unattended -- the only
      # thing standing between a bad formula and everybody's `brew upgrade`.
      # The org's automation App is subject to neither.
      - name: Generate a token for this repository
        id: app-token
        if: vars.GH_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The credential the steps below use to create the branch, commit
          # the formula and open the pull request.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Bump the formula
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty for scheduled runs, and for a dispatch that did not name one.
          REQUESTED: ${{ inputs.version || github.event.client_payload.version || '' }}
        run: |
          if [[ -n "$REQUESTED" ]]; then
            version="$(scripts/bump-formula.sh "$REQUESTED")"
          else
            version="$(scripts/bump-formula.sh)"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # main requires verified signatures, and a commit made with git on the runner
      # has none. The formula is committed through createCommitOnBranch instead,
      # which GitHub signs for the token that calls it.
      - name: Prepare the branch
        id: branch
        # An empty version means the formula was already current, so there is nothing to do.
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          branch="bump-formula-$VERSION"
          echo "name=$branch" >>"$GITHUB_OUTPUT"

          # Nothing changed means the bump reported a new version without changing the file.
          # That should be impossible -- bump-formula.sh verifies its own rewrite -- so treat
          # it as a failure rather than opening an empty pull request.
          if git diff --quiet -- Formula; then
            echo "::error::bump-formula.sh reported $VERSION but changed nothing" >&2
            exit 1
          fi

          # The branch can already exist from an earlier run that stopped partway. Only skip
          # when there is also a pull request open for it, otherwise the rerun would report
          # success while leaving the branch unmerged. A branch with no commit of its own
          # yet gets the formula committed onto it.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
              echo "Branch $branch already has an open pull request." >&2
              echo "action=none" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/$(git rev-parse HEAD)...${branch}" --jq .ahead_by)"
            if [ "$ahead" != "0" ]; then
              echo "Branch $branch exists with no open pull request; opening one." >&2
              echo "action=open" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Branch $branch exists with nothing on it; committing the formula." >&2
          else
            # signed-push commits onto an existing branch. It starts at the checked-out
            # commit, so its workflow files are main's own.
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${branch}" -f sha="$(git rev-parse HEAD)" >/dev/null
          fi

          # Only the formula goes into the commit. With prune off, signed-push adds or
          # updates what is staged here and leaves every other file on the branch alone.
          staged="$RUNNER_TEMP/formula-bump"
          mkdir -p "$staged/Formula"
          cp Formula/releasetools-cli.rb "$staged/Formula/"
          echo "staged=$staged" >>"$GITHUB_OUTPUT"
          echo "action=commit" >>"$GITHUB_OUTPUT"

      - name: Commit the formula, signed
        if: steps.branch.outputs.action == 'commit'
        uses: releasetools/actions/signed-push@05f197a5d5ed9b47c306389884b7cf79542132db # v0.9.1
        with:
          source-dir: ${{ steps.branch.outputs.staged }}
          target-repo: ${{ github.repository }}
          target-branch: ${{ steps.branch.outputs.name }}
          headline: "chore(formula): update releasetools-cli to ${{ steps.bump.outputs.version }}"
          prune: "false"
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Open a pull request
        if: steps.branch.outputs.action == 'commit' || steps.branch.outputs.action == 'open'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          # Built with printf so the YAML block indentation does not end up in the body.
          body="$(printf '%s\n\n%s\n' \
            "Points the formula at the \`releasetools.bash\` asset from [$VERSION](https://github.com/releasetools/cli/releases/tag/$VERSION), with the \`sha256\` taken from the checksum published alongside it after verifying the download against it." \
            "Opened by \`.github/workflows/bump-formula.yml\`.")"

          # --base is omitted so gh targets the repository's default branch.
          if out="$(gh pr create \
            --head "$BRANCH" \
            --title "chore(formula): update releasetools-cli to $VERSION" \
            --body "$body" 2>&1)"; then
            echo "$out"
            exit 0
          fi

          echo "$out" >&2
          compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BRANCH}?expand=1"

          # The branch is on the remote and the formula in it is correct, so the bump is not lost.
          # Still a failure: the job's purpose is to leave a reviewable pull request, and a
          # green tick here would mean nobody finds out it stopped halfway.
          case "$out" in
          *"not permitted to create or approve pull requests"*)
            echo "::error::Committed $BRANCH but could not open a pull request. This step runs as the automation App where GH_APP_CLIENT_ID is set; check that the App has Pull requests write and that its installation covers this repository. Open it by hand meanwhile: $compare"
            ;;
          *)
            echo "::error::Committed $BRANCH but could not open a pull request, see the output above. Open it by hand: $compare"
            ;;
          esac
          exit 1
