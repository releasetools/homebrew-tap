name: Bump formula

# Renovate handles the GitHub Actions in this repo, but it cannot bump the formula itself --
# see the comment at the top of scripts/bump-formula.sh, and the packageRules entry in
# renovate.json that disables its homebrew manager for that reason.
on:
  schedule:
    # Daily, so a missed dispatch still gets picked up.
    - cron: "17 9 * * *"

  # Manual runs, optionally targeting a specific release rather than the newest one.
  workflow_dispatch:
    inputs:
      version:
        description: "Release to bump to (e.g. v0.0.13). Defaults to the newest release."
        required: false
        default: ""

  # Lets releasetools/cli trigger this immediately after publishing a release. The payload
  # may carry a 'version'; without it the newest release is used.
  repository_dispatch:
    types: [upstream-released]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump the formula to the latest release
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN cannot open a pull request here: the organization does not
      # allow Actions to create them, and a repository cannot override that. One
      # it could open would have its checks held pending approval, which for a
      # formula bump means brew test-bot does not run unattended -- the only
      # thing standing between a bad formula and everybody's `brew upgrade`.
      # The org's automation App is subject to neither.
      - name: Generate a token for this repository
        id: app-token
        if: vars.GH_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # So the push below carries the App's identity rather than the
          # workflow's, which is what keeps the pull request's checks running.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Bump the formula
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty for scheduled runs, and for a dispatch that did not name one.
          REQUESTED: ${{ inputs.version || github.event.client_payload.version || '' }}
        run: |
          if [[ -n "$REQUESTED" ]]; then
            version="$(scripts/bump-formula.sh "$REQUESTED")"
          else
            version="$(scripts/bump-formula.sh)"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Open a pull request
        # An empty version means the formula was already current, so there is nothing to do.
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          # The App where there is one, so the commit is attributed to the
          # automation rather than to a bot nobody installed.
          COMMIT_NAME: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || 'github-actions[bot]' }}
          COMMIT_EMAIL: ${{ steps.app-token.outputs.app-slug && format('{0}+{1}[bot]@users.noreply.github.com', steps.app-token.outputs.installation-id, steps.app-token.outputs.app-slug) || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          branch="bump-formula-$VERSION"

          # Nothing staged means the bump reported a new version without changing the file.
          # That should be impossible -- bump-formula.sh verifies its own rewrite -- so treat
          # it as a failure rather than opening an empty pull request.
          git add Formula
          if git diff --cached --quiet; then
            echo "::error::bump-formula.sh reported $VERSION but changed nothing" >&2
            exit 1
          fi

          # The branch can already exist from an earlier run whose push succeeded but whose
          # pull request did not. Only skip when there is also a pull request open for it,
          # otherwise the rerun would report success while leaving the branch unmerged.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
              echo "Branch $branch is already pushed and has an open pull request." >&2
              exit 0
            fi
            echo "Branch $branch exists with no open pull request; opening one." >&2
            git checkout -B "$branch" "origin/$branch"
          else
            git config user.name "${COMMIT_NAME}"
            git config user.email "${COMMIT_EMAIL}"
            git checkout -b "$branch"
            git commit -m "chore(formula): update releasetools-cli to $VERSION"
            git push origin "$branch"
          fi

          # Built with printf so the YAML block indentation does not end up in the body.
          body="$(printf '%s\n\n%s\n' \
            "Points the formula at the \`releasetools.bash\` asset from [$VERSION](https://github.com/releasetools/cli/releases/tag/$VERSION), with the \`sha256\` taken from the checksum published alongside it after verifying the download against it." \
            "Opened by \`.github/workflows/bump-formula.yml\`.")"

          # --base is omitted so gh targets the repository's default branch.
          if out="$(gh pr create \
            --head "$branch" \
            --title "chore(formula): update releasetools-cli to $VERSION" \
            --body "$body" 2>&1)"; then
            echo "$out"
            exit 0
          fi

          echo "$out" >&2
          compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${branch}?expand=1"

          # The branch is pushed and the formula in it is correct, so the bump is not lost.
          # Still a failure: the job's purpose is to leave a reviewable pull request, and a
          # green tick here would mean nobody finds out it stopped halfway.
          case "$out" in
          *"not permitted to create or approve pull requests"*)
            echo "::error::Pushed $branch but could not open a pull request. This step runs as the automation App where GH_APP_CLIENT_ID is set; check that the App has Pull requests write and that its installation covers this repository. Open it by hand meanwhile: $compare"
            ;;
          *)
            echo "::error::Pushed $branch but could not open a pull request, see the output above. Open it by hand: $compare"
            ;;
          esac
          exit 1
